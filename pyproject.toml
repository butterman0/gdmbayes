[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gdmbayes"
version = "0.1.0"
description = "Bayesian and frequentist Generalised Dissimilarity Modelling in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Harold Horsley", email = "harryhorsley9@gmail.com"}
]
keywords = [
    "generalized-dissimilarity-modelling",
    "gdm",
    "beta-diversity",
    "biodiversity",
    "ecology",
    "bayesian",
    "pymc",
    "gaussian-process",
    "spatial-statistics",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pymc>=6.0",
    "pytensor>=3.0",
    "arviz>=1.1",
    "h5netcdf>=1.0",  # NetCDF backend for spGDMM.save()/load(); not pulled in by arviz
    "h5py>=3.0",  # required by h5netcdf but only an optional extra of it
    "numpy>=1.26",
    "pandas>=2.0",
    "xarray>=2023.1",
    "scipy>=1.12",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "dms-variants>=0.8",
    "geopy>=2.3",
    "properscoring>=0.1",
    "nutpie>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "pre-commit>=3.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]
docs = [
    "sphinx>=7.0",
    "numpydoc>=1.6",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/butterman0/gdmbayes"
Documentation = "https://gdmbayes.readthedocs.io"
Repository = "https://github.com/butterman0/gdmbayes"
Issues = "https://github.com/butterman0/gdmbayes/issues"
Changelog = "https://github.com/butterman0/gdmbayes/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["gdmbayes.tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501: line length handled by formatter. N801/N802/N803/N806: sklearn-style
# names (X, I_spline, spGDMM) are deliberate.
ignore = ["E501", "N801", "N802", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["src/gdmbayes/tests"]
python_files = ["test_*.py"]